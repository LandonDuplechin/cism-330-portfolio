<main>
  <section id="contact" class="card">
    <h2>Contact Me</h2>

    <p>
      Email:
      <a class="link" href="mailto:lduplechin0108239@students.point.edu">
        lduplechin0108239@students.point.edu
      </a>

    <!-- Portfolio Part 6: Form (5+ form elements + submit) -->
    <form class="contact-form" action="#" method="post">
      <fieldset>
        <legend>Send a Message</legend>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="topic">Topic</label>
        <select id="topic" name="topic" required>
          <option value="">Select one</option>
          <option value="projects">Projects</option>
          <option value="work">Work Opportunities</option>
          <option value="general">General Question</option>
        </select>

        <p class="form-hint">Preferred contact method:</p>
        <div class="radio-row">
          <input type="radio" id="contactEmail" name="contactMethod" value="email" checked>
          <label for="contactEmail">Email</label>

          <input type="radio" id="contactPhone" name="contactMethod" value="phone">
          <label for="contactPhone">Phone</label>
        </div>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <div class="check-row">
          <input type="checkbox" id="updates" name="updates" value="yes">
          <label for="updates">Send me occasional updates</label>
        </div>

        <button type="submit" class="btn">Submit</button>
      </fieldset>
    </form>

    <h3>Point University Location</h3>

    <iframe
      class="map"
      src="https://www.google.com/maps?q=Point+University,+West+Point,+GA&output=embed"
      title="Map showing Point University in West Point, Georgia"
      loading="lazy">
